<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>音畫布</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eee9df;font-family:system-ui,"Noto Sans TC",sans-serif;color:#26231f}body{touch-action:none}#paper,#ink,#fx{position:fixed;inset:0;width:100%;height:100%;touch-action:none}#paper{z-index:0}#ink{z-index:1}#fx{z-index:2;pointer-events:none}.ui{position:fixed;z-index:5;left:20px;right:20px;top:18px;display:flex;justify-content:space-between;gap:12px;pointer-events:none}.brand,.panel{pointer-events:auto;background:rgba(247,243,234,.72);backdrop-filter:blur(12px);border:1px solid rgba(60,50,40,.12);box-shadow:0 8px 30px rgba(50,40,30,.08);border-radius:18px}.brand{padding:11px 16px}.brand b{letter-spacing:.22em}.brand small{display:block;opacity:.55;margin-top:2px}.panel{display:flex;align-items:center;gap:7px;padding:7px}.panel button{border:0;border-radius:12px;padding:9px 11px;background:transparent;color:#38322b;cursor:pointer}.panel button:hover,.panel button.active{background:rgba(38,32,26,.1)}#status{position:fixed;z-index:5;bottom:18px;left:50%;transform:translateX(-50%);background:rgba(35,31,27,.72);color:#fff;padding:8px 13px;border-radius:999px;font-size:12px;opacity:.72;pointer-events:none;white-space:nowrap}@media(max-width:720px){.ui{left:8px;right:8px;top:8px;align-items:flex-start}.brand{padding:9px 11px;flex:0 0 auto}.brand small{display:none}.panel{margin-left:auto;max-width:calc(100vw - 104px);overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch}.panel::-webkit-scrollbar{display:none}.panel button{padding:10px 12px;min-width:58px;min-height:44px;font-size:14px;white-space:nowrap}.panel{gap:3px}#status{bottom:max(12px,env(safe-area-inset-bottom));max-width:92vw;overflow:hidden;text-overflow:ellipsis}}
@media(min-width:1000px){.ui{left:28px;right:28px;top:24px}.brand{font-size:20px;padding:14px 20px}.panel{padding:10px;gap:8px}.panel button{font-size:18px;min-height:54px;padding:12px 16px;border-radius:15px}#status{font-size:16px;padding:11px 18px}}
@media(orientation:landscape) and (max-height:520px){.brand small{display:none}.ui{top:6px}.brand{padding:8px 10px}.panel{padding:4px}.panel button{min-height:40px;padding:7px 10px}#status{bottom:6px}}
</style></head><body><canvas id="paper"></canvas><canvas id="ink"></canvas><canvas id="fx"></canvas><div class="ui"><div class="brand"><b>音畫布</b><small>以筆為聲，以聲成畫</small></div><div class="panel" id="tools"><button data-inst="bell" class="active">鐘琴</button><button data-inst="wood">木琴</button><button data-inst="pluck">撥弦</button><button data-inst="flute">笛聲</button><button data-inst="pad">墊音</button><button id="clear">清空</button><button id="rec">● 錄影</button></div></div><div id="status">輕點、拖曳、畫圈，試著讓畫面發聲</div><script>
const paper=document.querySelector('#paper'), ink=document.querySelector('#ink'), fx=document.querySelector('#fx');const pc=paper.getContext('2d'),ic=ink.getContext('2d'),fc=fx.getContext('2d');let W,H,dpr,inst='bell',audio=null,master=null,dest=null,noiseBuffer=null,recording=false,recorder,chunks=[];const pts=new Map();
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;for(const c of [paper,ink,fx]){c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';c.style.height=H+'px';c.getContext('2d').setTransform(dpr,0,0,dpr,0,0)}drawPaper()}addEventListener('resize',resize);
function drawPaper(){pc.clearRect(0,0,W,H);pc.fillStyle='#f3eee4';pc.fillRect(0,0,W,H);const img=pc.createImageData(Math.ceil(W/2),Math.ceil(H/2));for(let i=0;i<img.data.length;i+=4){let n=225+Math.random()*25;img.data[i]=n;img.data[i+1]=n-3;img.data[i+2]=n-10;img.data[i+3]=Math.random()*22}const t=document.createElement('canvas');t.width=img.width;t.height=img.height;t.getContext('2d').putImageData(img,0,0);pc.globalAlpha=.32;pc.drawImage(t,0,0,W,H);pc.globalAlpha=.05;for(let i=0;i<120;i++){pc.beginPath();pc.moveTo(Math.random()*W,0);pc.lineTo(Math.random()*W,H);pc.strokeStyle='#665b4e';pc.lineWidth=Math.random()*.5;pc.stroke()}pc.globalAlpha=1}
function initAudio(){if(audio)return;audio=new (window.AudioContext||window.webkitAudioContext)();master=audio.createGain();master.gain.value=.45;dest=audio.createMediaStreamDestination();master.connect(audio.destination);master.connect(dest);noiseBuffer=audio.createBuffer(1,audio.sampleRate,audio.sampleRate);let d=noiseBuffer.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
function freq(y){const scale=[0,2,4,7,9,12,14,16,19,21,24];let k=Math.max(0,Math.min(scale.length-1,Math.floor((1-y/H)*scale.length)));return 130.81*Math.pow(2,scale[k]/12)}
function tone(type,f,v=.3,d=.6){initAudio();if(audio.state==='suspended')audio.resume();let now=audio.currentTime,g=audio.createGain(),o=audio.createOscillator();o.frequency.value=f;g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(Math.max(.01,v),now+.012);let stop=d;if(type==='bell'){o.type='sine';g.gain.exponentialRampToValueAtTime(.0001,now+1.4);stop=1.5;let o2=audio.createOscillator(),g2=audio.createGain();o2.frequency.value=f*2.01;o2.type='sine';g2.gain.setValueAtTime(v*.35,now);g2.gain.exponentialRampToValueAtTime(.0001,now+.7);o2.connect(g2).connect(master);o2.start();o2.stop(now+.75)}else if(type==='wood'){o.type='triangle';g.gain.exponentialRampToValueAtTime(.0001,now+.22);stop=.25}else if(type==='pluck'){o.type='sawtooth';let fil=audio.createBiquadFilter();fil.type='lowpass';fil.frequency.setValueAtTime(2400,now);fil.frequency.exponentialRampToValueAtTime(350,now+.5);o.connect(fil);fil.connect(g);g.gain.exponentialRampToValueAtTime(.0001,now+.55);g.connect(master);o.start();o.stop(now+.6);return}else if(type==='flute'){o.type='sine';let vib=audio.createOscillator(),vg=audio.createGain();vib.frequency.value=5;vg.gain.value=5;vib.connect(vg).connect(o.frequency);vib.start();vib.stop(now+stop);g.gain.exponentialRampToValueAtTime(.0001,now+stop)}else{o.type='sine';g.gain.exponentialRampToValueAtTime(v*.6,now+.2);g.gain.exponentialRampToValueAtTime(.0001,now+1.8);stop=1.9}o.connect(g).connect(master);o.start();o.stop(now+stop)}
function drum(v=.18){initAudio();let s=audio.createBufferSource(),g=audio.createGain(),f=audio.createBiquadFilter(),now=audio.currentTime;s.buffer=noiseBuffer;f.type='bandpass';f.frequency.value=900;g.gain.setValueAtTime(v,now);g.gain.exponentialRampToValueAtTime(.0001,now+.08);s.connect(f).connect(g).connect(master);s.start();s.stop(now+.1)}
function dot(x,y,r,a=.08){fc.save();fc.globalCompositeOperation='multiply';for(let i=0;i<4;i++){fc.beginPath();fc.arc(x+(Math.random()-.5)*r*.3,y+(Math.random()-.5)*r*.3,r*(.7+Math.random()*.6),0,Math.PI*2);fc.fillStyle=`rgba(20,24,23,${a/(i+1)})`;fc.fill()}fc.restore()}
function start(e){e.preventDefault();initAudio();ink.setPointerCapture?.(e.pointerId);let p={x:e.clientX,y:e.clientY,t:performance.now(),path:[[e.clientX,e.clientY]],lastSound:0,dist:0};pts.set(e.pointerId,p);dot(p.x,p.y,8,.09);tone(inst,freq(p.y),.16,.45)}
function move(e){e.preventDefault();let p=pts.get(e.pointerId);if(!p)return;let x=e.clientX,y=e.clientY,now=performance.now(),dx=x-p.x,dy=y-p.y,dist=Math.hypot(dx,dy);if(dist<1.6)return;let dt=Math.max(1,now-p.t),speed=dist/dt,pressure=e.pressure||.45,width=2.2+pressure*7+Math.max(0,3-speed*2);ic.save();ic.globalCompositeOperation='multiply';ic.lineCap='round';ic.lineJoin='round';ic.strokeStyle=`rgba(22,27,25,${Math.max(.22,.82-speed*.28)})`;ic.lineWidth=width;ic.beginPath();let prev=p.path[p.path.length-2]||[p.x,p.y];ic.moveTo(prev[0],prev[1]);ic.quadraticCurveTo(p.x,p.y,(p.x+x)/2,(p.y+y)/2);ic.stroke();ic.restore();if(speed>.8&&Math.random()<.35){ic.save();ic.globalAlpha=.22;for(let i=0;i<3;i++){ic.beginPath();ic.arc(x+(Math.random()-.5)*10,y+(Math.random()-.5)*10,Math.random()*1.4,0,7);ic.fill()}ic.restore()}if(now-p.lastSound>75){tone(inst,freq(y),Math.min(.3,.08+speed*.08),inst==='pad'?1.3:.35);if(speed>1.8)drum(.08);p.lastSound=now}p.dist+=dist;p.x=x;p.y=y;p.t=now;p.path.push([x,y]);if(p.path.length>80)p.path.shift()}
function end(e){e.preventDefault();let p=pts.get(e.pointerId);if(!p)return;if(p.path.length>8){let first=p.path[0],last=p.path[p.path.length-1],close=Math.hypot(last[0]-first[0],last[1]-first[1]);if(close<45&&p.dist>130){dot(last[0],last[1],26,.045);tone('pad',freq(last[1]),.22,1.8)}}pts.delete(e.pointerId)}
ink.addEventListener('contextmenu',e=>e.preventDefault());ink.addEventListener('pointerdown',start,{passive:false});ink.addEventListener('pointermove',move,{passive:false});ink.addEventListener('pointerup',end,{passive:false});ink.addEventListener('pointercancel',end,{passive:false});document.querySelectorAll('[data-inst]').forEach(b=>b.onclick=()=>{inst=b.dataset.inst;document.querySelectorAll('[data-inst]').forEach(x=>x.classList.toggle('active',x===b));status.textContent='目前音色：'+b.textContent});clear.onclick=()=>{ic.clearRect(0,0,W,H);fc.clearRect(0,0,W,H)};
async function toggleRec(){initAudio();if(!recording){let stream=ink.captureStream(30);dest.stream.getAudioTracks().forEach(t=>stream.addTrack(t));let mime=['video/mp4;codecs=avc1,mp4a.40.2','video/webm;codecs=vp9,opus','video/webm'].find(MediaRecorder.isTypeSupported)||'';recorder=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);chunks=[];recorder.ondataavailable=e=>e.data.size&&chunks.push(e.data);recorder.onstop=()=>{let blob=new Blob(chunks,{type:recorder.mimeType}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='音畫布-'+new Date().toISOString().slice(0,19).replaceAll(':','-')+(recorder.mimeType.includes('mp4')?'.mp4':'.webm');a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};recorder.start();recording=true;rec.textContent='■ 停止';status.textContent='正在錄製聲音與筆跡…'}else{recorder.stop();recording=false;rec.textContent='● 錄影';status.textContent='錄影已輸出'}}rec.onclick=toggleRec;resize();
</script></body></html>
