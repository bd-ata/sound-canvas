<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#eee9df"><title>音畫布</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eee9df;font-family:system-ui,"Noto Sans TC",sans-serif;color:#26231f}body{touch-action:none}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}#paper{z-index:0}#ink{z-index:1}.ui{position:fixed;z-index:5;left:12px;right:12px;top:max(10px,env(safe-area-inset-top));display:flex;justify-content:space-between;gap:10px;pointer-events:none}.brand,.panel{pointer-events:auto;background:rgba(250,247,240,.78);backdrop-filter:blur(14px);border:1px solid #ffffff80;box-shadow:0 8px 28px #493b2a18;border-radius:18px}.brand{padding:10px 14px;flex:0 0 auto}.brand b{letter-spacing:.16em}.brand small{display:block;opacity:.55;font-size:11px;margin-top:2px}.panel{display:flex;gap:5px;padding:6px;overflow-x:auto;max-width:75vw;scrollbar-width:none}.panel::-webkit-scrollbar{display:none}button{border:0;border-radius:12px;padding:9px 11px;background:transparent;min-height:42px;white-space:nowrap;font-weight:650;color:#38322b}button.active{background:var(--c);color:#fff;box-shadow:0 3px 12px #0002}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:5px;box-shadow:0 0 0 2px #fff8}.active .dot{box-shadow:0 0 0 2px #ffffffaa}#play{background:#25211d;color:white}#play:disabled{opacity:.35}#status{position:fixed;z-index:5;bottom:max(12px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#26211dc7;color:white;padding:8px 13px;border-radius:999px;font-size:12px;pointer-events:none;white-space:nowrap}.playing{animation:pulse .9s infinite alternate}@keyframes pulse{to{transform:scale(1.03)}}
@media(max-width:720px){.ui{left:7px;right:7px}.brand{padding:8px 10px}.brand small{display:none}.panel{max-width:calc(100vw - 90px);padding:4px}button{padding:9px 10px;min-height:44px;font-size:13px}}
@media(min-width:1000px){.ui{left:28px;right:28px;top:24px}.brand{font-size:21px;padding:14px 20px}.panel{padding:9px;gap:8px}button{font-size:18px;min-height:54px;padding:12px 16px}#status{font-size:16px;padding:11px 18px}}
</style></head><body><canvas id="paper"></canvas><canvas id="ink"></canvas><div class="ui"><div class="brand"><b>音畫布</b><small>以筆為聲，以聲成畫</small></div><div class="panel" id="tools">
<button data-inst="bell" class="active" style="--c:#d6a52d"><i class="dot"></i>鐘琴</button><button data-inst="wood" style="--c:#b66a3c"><i class="dot"></i>木琴</button><button data-inst="pluck" style="--c:#567d67"><i class="dot"></i>撥弦</button><button data-inst="flute" style="--c:#4f83a6"><i class="dot"></i>笛聲</button><button data-inst="pad" style="--c:#8067a8"><i class="dot"></i>墊音</button><button id="play" disabled>▶ 回放</button><button id="clear">清空</button></div></div><div id="status">選一種聲音，用手指畫下第一筆</div><script>
const colors={bell:'#d6a52d',wood:'#b66a3c',pluck:'#567d67',flute:'#4f83a6',pad:'#8067a8'};
const paper=document.querySelector('#paper'),ink=document.querySelector('#ink'),pc=paper.getContext('2d'),ic=ink.getContext('2d');let W,H,dpr,inst='bell',audio,master,noiseBuffer;const active=new Map();let events=[],sessionStart=null,isPlaying=false;
function resize(){const old=document.createElement('canvas');old.width=ink.width;old.height=ink.height;old.getContext('2d').drawImage(ink,0,0);dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;for(const c of [paper,ink]){c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';c.style.height=H+'px';c.getContext('2d').setTransform(dpr,0,0,dpr,0,0)}drawPaper();if(old.width)ic.drawImage(old,0,0,old.width,old.height,0,0,W,H)}addEventListener('resize',resize);
function drawPaper(){pc.fillStyle='#f4efe5';pc.fillRect(0,0,W,H);pc.save();for(let i=0;i<W*H/1800;i++){pc.globalAlpha=Math.random()*.06;pc.strokeStyle='#796c58';pc.beginPath();let x=Math.random()*W,y=Math.random()*H;pc.moveTo(x,y);pc.lineTo(x+Math.random()*35-17,y+Math.random()*2-1);pc.stroke()}pc.restore()}
function initAudio(){if(audio){if(audio.state==='suspended')audio.resume();return}audio=new (window.AudioContext||window.webkitAudioContext)();master=audio.createGain();master.gain.value=.45;master.connect(audio.destination);noiseBuffer=audio.createBuffer(1,audio.sampleRate*.25,audio.sampleRate);let a=noiseBuffer.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}
function frequency(y){const scale=[0,2,4,7,9,12,14,16,19,21,24];let i=Math.max(0,Math.min(scale.length-1,Math.floor((1-y/H)*scale.length)));return 196*Math.pow(2,scale[i]/12)}
function sound(type,f,v=.3,d=.35){initAudio();const now=audio.currentTime,g=audio.createGain();g.connect(master);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(Math.max(.015,v),now+.012);g.gain.exponentialRampToValueAtTime(.0001,now+d);if(type==='wood'){const o=audio.createOscillator();o.type='sine';o.frequency.value=f*.7;o.connect(g);o.start();o.stop(now+d)}else if(type==='pluck'){const o=audio.createOscillator();o.type='triangle';o.frequency.value=f;o.connect(g);o.start();o.stop(now+d*.75)}else if(type==='flute'){const o=audio.createOscillator(),fil=audio.createBiquadFilter();o.type='sine';o.frequency.value=f;fil.type='lowpass';fil.frequency.value=1800;o.connect(fil).connect(g);o.start();o.stop(now+d*1.5)}else if(type==='pad'){const o1=audio.createOscillator(),o2=audio.createOscillator();o1.type='sine';o2.type='triangle';o1.frequency.value=f/2;o2.frequency.value=f/2*1.006;o1.connect(g);o2.connect(g);o1.start();o2.start();o1.stop(now+d*2.2);o2.stop(now+d*2.2)}else{const o=audio.createOscillator();o.type='sine';o.frequency.value=f;const o2=audio.createOscillator(),g2=audio.createGain();o2.frequency.value=f*2.01;g2.gain.value=.22;o2.connect(g2).connect(g);o.connect(g);o.start();o2.start();o.stop(now+d*1.7);o2.stop(now+d*1.2)}}
function line(a,b,type,width,alpha=.72){ic.save();ic.globalCompositeOperation='multiply';ic.strokeStyle=colors[type];ic.globalAlpha=alpha;ic.lineCap='round';ic.lineJoin='round';ic.lineWidth=width;ic.beginPath();ic.moveTo(a.x,a.y);ic.quadraticCurveTo(a.x,a.y,(a.x+b.x)/2,(a.y+b.y)/2);ic.stroke();ic.globalAlpha=.10;ic.lineWidth=width*2.1;ic.stroke();ic.restore()}
function addEvent(kind,p,type,extra={}){if(sessionStart===null)sessionStart=performance.now();events.push({t:performance.now()-sessionStart,kind,x:p.x/W,y:p.y/H,type,...extra});document.querySelector('#play').disabled=false}
ink.addEventListener('pointerdown',e=>{if(isPlaying)return;initAudio();ink.setPointerCapture(e.pointerId);const p={x:e.clientX,y:e.clientY,time:performance.now()};active.set(e.pointerId,p);addEvent('down',p,inst);sound(inst,frequency(p.y),.28,.32);document.querySelector('#status').textContent=`正在畫：${e.target.pointerType==='pen'?'觸控筆':'觸控'}・${document.querySelector('[data-inst="'+inst+'"]').textContent.trim()}`});
ink.addEventListener('pointermove',e=>{if(!active.has(e.pointerId)||isPlaying)return;const a=active.get(e.pointerId),b={x:e.clientX,y:e.clientY,time:performance.now()},dist=Math.hypot(b.x-a.x,b.y-a.y);if(dist<3)return;const speed=dist/Math.max(1,b.time-a.time),w=Math.max(2,Math.min(14,9-speed*2.4));line(a,b,inst,w,.48+Math.min(.35,speed*.1));if(Math.random()<Math.min(.38,dist/35)){sound(inst,frequency(b.y),.08+Math.min(.18,speed*.04),.18);addEvent('note',b,inst,{v:.08+Math.min(.18,speed*.04)})}active.set(e.pointerId,b)});
function end(e){if(!active.has(e.pointerId))return;const p=active.get(e.pointerId);addEvent('up',p,inst);active.delete(e.pointerId);document.querySelector('#status').textContent='完成一筆・按「▶ 回放」重看剛才的聲音與畫'}ink.addEventListener('pointerup',end);ink.addEventListener('pointercancel',end);
document.querySelectorAll('[data-inst]').forEach(b=>b.onclick=()=>{inst=b.dataset.inst;document.querySelectorAll('[data-inst]').forEach(x=>x.classList.toggle('active',x===b));document.querySelector('#status').textContent=`${b.textContent.trim()}＝${colors[inst]}・開始畫吧`});
document.querySelector('#clear').onclick=()=>{if(isPlaying)return;ic.clearRect(0,0,W,H);events=[];sessionStart=null;document.querySelector('#play').disabled=true;document.querySelector('#status').textContent='畫布已清空'};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function replay(){if(!events.length||isPlaying)return;initAudio();isPlaying=true;const btn=document.querySelector('#play');btn.textContent='■ 回放中';btn.classList.add('playing');ic.clearRect(0,0,W,H);document.querySelector('#status').textContent='正在回放你的音畫…';const last=new Map();let prev=0;for(const ev of events){await wait(Math.min(500,Math.max(0,ev.t-prev)));prev=ev.t;const p={x:ev.x*W,y:ev.y*H};if(ev.kind==='down'){last.set(ev.type,p);sound(ev.type,frequency(p.y),.28,.32)}else if(ev.kind==='note'){const a=last.get(ev.type)||p;line(a,p,ev.type,5,.7);last.set(ev.type,p);sound(ev.type,frequency(p.y),ev.v||.12,.18)}else if(ev.kind==='up'){last.delete(ev.type)}}btn.textContent='▶ 回放';btn.classList.remove('playing');isPlaying=false;document.querySelector('#status').textContent='回放完成・可以繼續畫，新的筆畫會接在後面'}document.querySelector('#play').onclick=replay;
resize();
</script></body></html>
