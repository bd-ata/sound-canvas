<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f2eee6">
<title>音畫布 v13・連奏版</title>
<style>
:root{
  --paper:#f4f0e8; --ink:#2e2a25; --muted:#756f66;
  --glass:rgba(250,248,243,.88); --line:rgba(73,63,51,.11);
  --shadow:0 12px 34px rgba(54,45,34,.10);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",system-ui,sans-serif}
body{touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#paper{z-index:0} #ink{z-index:1} #fx{z-index:2;pointer-events:none}

.top{
  position:fixed;z-index:10;left:16px;right:16px;top:max(14px,env(safe-area-inset-top));
  display:flex;align-items:flex-start;gap:10px;pointer-events:none
}
.brand,.toolbar,.panel{
  background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.78);box-shadow:var(--shadow)
}
.brand{pointer-events:auto;flex:none;border-radius:18px;padding:11px 14px}
.brand b{font-family:ui-serif,"Songti TC","Noto Serif TC",serif;font-size:18px;letter-spacing:.16em}
.brand small{display:block;margin-top:2px;font-size:10px;color:var(--muted);letter-spacing:.08em}

.toolbar{
  pointer-events:auto;display:flex;align-items:center;gap:4px;padding:5px;border-radius:18px;
  overflow-x:auto;min-width:0;scrollbar-width:none
}
.toolbar::-webkit-scrollbar{display:none}
button,select,input{font:inherit}
button{
  border:0;border-radius:13px;background:transparent;color:#3b3731;font-weight:700;
  min-height:44px;padding:8px 10px;white-space:nowrap;cursor:pointer
}
button:disabled{opacity:.28;cursor:default}
button.action{background:rgba(255,255,255,.62)}
#play{background:#302c27;color:white}
#history{background:#6f675d;color:white}
#musicBtn{background:#e9e2d6}
.inst{--c:#777}
.inst .dot{
  display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);
  margin-right:5px;vertical-align:1px;box-shadow:0 0 0 2px rgba(255,255,255,.7)
}
.inst.active{background:var(--c);color:white;box-shadow:0 5px 16px color-mix(in srgb,var(--c) 25%,transparent)}
.inst.active .dot{box-shadow:0 0 0 2px rgba(255,255,255,.46)}

.quick{
  position:fixed;z-index:9;left:16px;top:82px;display:flex;gap:5px;padding:5px 7px;
  border-radius:15px;background:rgba(250,248,243,.76);backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.7);box-shadow:0 8px 24px rgba(54,45,34,.06)
}
.quick label{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:11px}
.quick select{appearance:none;border:0;border-radius:10px;background:rgba(255,255,255,.68);padding:7px 8px;color:#3b3731;font-size:11px;font-weight:650}

#musicPanel{
  position:fixed;z-index:20;right:16px;top:82px;width:min(390px,calc(100vw - 32px));
  max-height:calc(100vh - 110px);overflow:auto;border-radius:22px;padding:16px;display:none
}
#musicPanel.open{display:block}
.panelHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.panelHead b{font-family:ui-serif,"Songti TC","Noto Serif TC",serif;font-size:18px;letter-spacing:.08em}
.panelHead button{min-height:34px;padding:4px 9px;font-size:12px;background:rgba(255,255,255,.6)}
.group{padding:12px 0;border-top:1px solid var(--line)}
.group:first-of-type{border-top:0;padding-top:2px}
.groupTitle{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:.08em;margin-bottom:9px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.field label,.sliderRow label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}
.field select{
  width:100%;appearance:none;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.66);
  padding:10px 11px;color:#39352f;font-size:13px;font-weight:700
}
.sliderRow{display:grid;grid-template-columns:1fr auto;align-items:end;gap:10px;margin-top:10px}
.sliderWrap{min-width:0}
.sliderWrap input[type=range]{width:100%;accent-color:#6e665c}
.value{min-width:48px;text-align:right;font-variant-numeric:tabular-nums;font-size:12px;font-weight:800;color:#4b463f}
.hint{margin-top:8px;font-size:10px;line-height:1.5;color:#8a8379}

#status{
  position:fixed;z-index:9;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);
  background:rgba(45,41,36,.82);color:white;border-radius:999px;padding:9px 14px;font-size:11px;
  white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis;pointer-events:none;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)
}

@media(max-width:760px){
  .top{left:7px;right:7px;top:max(7px,env(safe-area-inset-top));gap:5px}
  .brand{padding:8px 9px;border-radius:15px}.brand b{font-size:14px;letter-spacing:.10em}.brand small{display:none}
  .toolbar{padding:3px;border-radius:15px;gap:2px}
  button{font-size:11px;min-height:42px;padding:7px 8px}
  .quick{left:7px;top:59px;max-width:calc(100vw - 14px);overflow-x:auto}
  .quick label{font-size:10px}.quick select{font-size:10px;padding:6px 7px}
  #musicPanel{right:7px;top:106px;width:calc(100vw - 14px);max-height:calc(100vh - 120px);padding:14px}
}
@media(min-width:1200px){
  .top{left:24px;right:24px;top:20px}.quick{left:24px;top:92px}
  button{font-size:15px;min-height:50px;padding:9px 13px}
  .brand{padding:13px 17px}.brand b{font-size:21px}
  #musicPanel{right:24px;top:92px}
}
</style>
</head>
<body>
<canvas id="paper"></canvas>
<canvas id="ink"></canvas>
<canvas id="fx"></canvas>

<div class="top">
  <div class="brand"><b>音畫布</b><small>DRAW • LISTEN • REMEMBER</small></div>
  <div class="toolbar">
    <button class="inst active" data-inst="bell" style="--c:#c59b42"><i class="dot"></i>鐘琴</button>
    <button class="inst" data-inst="wood" style="--c:#a86649"><i class="dot"></i>木琴</button>
    <button class="inst" data-inst="pluck" style="--c:#647c68"><i class="dot"></i>撥弦</button>
    <button class="inst" data-inst="guqin" style="--c:#755447"><i class="dot"></i>古琴</button>
    <button class="inst" data-inst="flute" style="--c:#66889a"><i class="dot"></i>笛聲</button>
    <button class="inst" data-inst="pad" style="--c:#81728f"><i class="dot"></i>墊音</button>
    <button id="play" disabled>▶ 播放</button>
    <button id="history" disabled>↺ 歷程</button>
    <button id="record" class="action" disabled>● 錄影下載</button>
    <button id="musicBtn">🎚 音樂風格</button>
    <button id="clear" class="action">清空</button>
  </div>
</div>

<div class="quick">
  <label>音樂風格
    <select id="presetQuick">
      <option value="gentle" selected>推薦・舒服耐聽</option>
      <option value="oriental">東方・空靈</option>
      <option value="bright">明亮・童趣</option>
      <option value="warm">溫柔・療癒</option>
      <option value="rhythm">律動・有節奏</option>
    </select>
  </label>
  <button id="advancedToggle" class="action" style="min-height:34px;padding:6px 9px;font-size:11px">進階設定</button>
</div>

<div id="musicPanel" class="panel">
  <div class="panelHead"><b>音樂設定</b><button id="closePanel">收起</button></div>
  <div class="group" style="padding-top:2px">
    <div class="groupTitle">PRESET｜先選一種感覺就好</div>
    <div class="field">
      <label>音樂風格</label>
      <select id="preset">
        <option value="gentle" selected>推薦・舒服耐聽</option>
        <option value="oriental">東方・空靈</option>
        <option value="bright">明亮・童趣</option>
        <option value="warm">溫柔・療癒</option>
        <option value="rhythm">律動・有節奏</option>
      </select>
    </div>
    <div id="presetDesc" class="hint">最不容易刺耳：長線會連續滑音，搭配五聲音階、柔和和聲與少量鼓點。</div>
  </div>
  <div id="advancedGroups" style="display:none">

  <div class="group">
    <div class="groupTitle">TONALITY｜調性與音階</div>
    <div class="grid2">
      <div class="field"><label>主音 Key</label>
        <select id="root">
          <option value="0">C</option><option value="1">C♯ / D♭</option><option value="2">D</option>
          <option value="3">E♭</option><option value="5">F</option><option value="7" selected>G</option>
          <option value="9">A</option><option value="10">B♭</option>
        </select>
      </div>
      <div class="field"><label>音階 Scale</label>
        <select id="scale">
          <option value="pent_major">宮調五聲</option><option value="pent_minor">羽調五聲</option>
          <option value="major">大調</option><option value="minor">小調</option>
          <option value="dorian">Dorian</option><option value="hirajoshi">和風五聲</option>
        </select>
      </div>
      <div class="field"><label>聲音高度</label>
        <select id="range">
          <option value="low">低沉</option><option value="mid" selected>自然</option>
          <option value="high">明亮</option><option value="wide">寬廣</option>
        </select>
      </div>
      <div class="field"><label>和聲 Harmony</label>
        <select id="harmony">
          <option value="off">關閉</option><option value="soft" selected>柔和</option><option value="rich">豐富</option>
        </select>
      </div>
    </div>
    <div class="hint">笛聲與墊音會保持一口氣的連奏，但音高只落在音階裡；古琴、撥弦、鐘琴與木琴保留自然起音。</div>
  </div>

  <div class="group">
    <div class="groupTitle">RHYTHM｜速度、拍號與量化</div>
    <div class="grid2">
      <div class="field"><label>拍號 Meter</label>
        <select id="meter"><option value="4/4" selected>4 / 4</option><option value="3/4">3 / 4</option><option value="6/8">6 / 8</option></select>
      </div>
      <div class="field"><label>樂句長度</label>
        <select id="bars"><option value="2">2 小節</option><option value="4" selected>4 小節</option><option value="8">8 小節</option></select>
      </div>
      <div class="field"><label>量化 Quantize</label>
        <select id="quantize"><option value="1">1 / 4</option><option value="2" selected>1 / 8</option><option value="4">1 / 16</option></select>
      </div>
      <div class="field"><label>鼓點 Groove</label>
        <select id="groove"><option value="off">無鼓</option><option value="air" selected>疏</option><option value="pulse">律動</option><option value="full">豐富</option></select>
      </div>
    </div>
    <div class="sliderRow">
      <div class="sliderWrap"><label>BPM</label><input id="bpm" type="range" min="50" max="150" step="1" value="84"></div>
      <div class="value"><span id="bpmV">84</span></div>
    </div>
    <div class="sliderRow">
      <div class="sliderWrap"><label>Swing 搖擺</label><input id="swing" type="range" min="0" max="35" step="1" value="8"></div>
      <div class="value"><span id="swingV">8</span>%</div>
    </div>
    <div class="sliderRow">
      <div class="sliderWrap"><label>鼓點密度</label><input id="density" type="range" min="0" max="100" step="1" value="45"></div>
      <div class="value"><span id="densityV">45</span>%</div>
    </div>
  </div>

  <div class="group">
    <div class="groupTitle">SPACE｜空間與尾韻</div>
    <div class="sliderRow">
      <div class="sliderWrap"><label>Reverb 殘響</label><input id="reverb" type="range" min="0" max="80" step="1" value="28"></div>
      <div class="value"><span id="reverbV">28</span>%</div>
    </div>
    <div class="sliderRow">
      <div class="sliderWrap"><label>Delay Echo</label><input id="delayAmt" type="range" min="0" max="60" step="1" value="14"></div>
      <div class="value"><span id="delayV">14</span>%</div>
    </div>
    <div class="hint">殘響讓聲音更有空間；Delay 適合鐘琴、古琴與撥弦，但太多會變混濁。</div>
  </div>
  </div>
</div>

<div id="status">自由畫畫；上下是音高、左右是時間、力度是音量</div>

<script>
/*
  音畫布 v13
  基於我們自己的 v10 架構延伸：
  - 左→右掃描
  - 每一筆獨立聲部
  - 連續取樣 / 音階內連奏（非無限滑音）
  - 播放、歷程播放、錄影下載
  不使用外部專案程式碼。
*/
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
const paper=$('#paper'), ink=$('#ink'), fx=$('#fx');
const pc=paper.getContext('2d'), ic=ink.getContext('2d'), fc=fx.getContext('2d');

const COLORS={bell:'#c59b42',wood:'#a86649',pluck:'#647c68',guqin:'#755447',flute:'#66889a',pad:'#81728f'};
const SCALES={
  pent_major:[0,2,4,7,9],
  pent_minor:[0,3,5,7,10],
  major:[0,2,4,5,7,9,11],
  minor:[0,2,3,5,7,8,10],
  dorian:[0,2,3,5,7,9,10],
  hirajoshi:[0,2,3,7,8]
};
const BASE_MIDI={low:43,mid:55,high:67,wide:43};

let W=innerWidth,H=innerHeight,DPR=1;
let instrument='bell', strokes=[], active=new Map(), sessionStart=null, playing=false;
let audio=null, master=null, compressor=null, mediaDest=null;
let reverbSend=null, delaySend=null, convolver=null, delayNode=null, delayFeedback=null;
let noiseBuffer=null, liveVoices=new Map();

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function resize(){
  W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);
  for(const c of [paper,ink,fx]){
    c.width=W*DPR;c.height=H*DPR;c.style.width=W+'px';c.style.height=H+'px';
    c.getContext('2d').setTransform(DPR,0,0,DPR,0,0);
  }
  drawPaper();redrawAll();
}
addEventListener('resize',resize);

function drawPaper(){
  pc.clearRect(0,0,W,H);
  pc.fillStyle='#f4f0e8';pc.fillRect(0,0,W,H);
  pc.save();
  for(let i=0;i<Math.max(200,W*H/1500);i++){
    const x=Math.random()*W,y=Math.random()*H,l=10+Math.random()*46;
    pc.strokeStyle=`rgba(89,76,60,${.006+Math.random()*.015})`;
    pc.lineWidth=.35+Math.random()*.55;pc.beginPath();pc.moveTo(x,y);pc.lineTo(x+l,y+(Math.random()-.5)*1.5);pc.stroke();
  }
  pc.restore();
}

function createImpulse(ctx,seconds=2.6,decay=2.5){
  const len=Math.floor(ctx.sampleRate*seconds), b=ctx.createBuffer(2,len,ctx.sampleRate);
  for(let ch=0;ch<2;ch++){
    const d=b.getChannelData(ch);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay);
  }
  return b;
}

function initAudio(){
  if(audio){if(audio.state==='suspended')audio.resume();updateFx();return}
  audio=new (window.AudioContext||window.webkitAudioContext)();

  master=audio.createGain(); master.gain.value=.42;
  compressor=audio.createDynamicsCompressor();
  compressor.threshold.value=-18;compressor.knee.value=18;compressor.ratio.value=3.2;compressor.attack.value=.008;compressor.release.value=.25;

  reverbSend=audio.createGain(); reverbSend.gain.value=.18;
  convolver=audio.createConvolver(); convolver.buffer=createImpulse(audio);
  const reverbWet=audio.createGain(); reverbWet.gain.value=.48;

  delaySend=audio.createGain(); delaySend.gain.value=.08;
  delayNode=audio.createDelay(.8); delayNode.delayTime.value=.23;
  delayFeedback=audio.createGain(); delayFeedback.gain.value=.18;
  const delayWet=audio.createGain(); delayWet.gain.value=.55;

  master.connect(compressor);
  master.connect(reverbSend); reverbSend.connect(convolver).connect(reverbWet).connect(compressor);
  master.connect(delaySend); delaySend.connect(delayNode);delayNode.connect(delayFeedback).connect(delayNode);delayNode.connect(delayWet).connect(compressor);

  compressor.connect(audio.destination);
  mediaDest=audio.createMediaStreamDestination(); compressor.connect(mediaDest);

  noiseBuffer=audio.createBuffer(1,audio.sampleRate*.7,audio.sampleRate);
  const n=noiseBuffer.getChannelData(0);for(let i=0;i<n.length;i++)n[i]=Math.random()*2-1;
  updateFx();
}

function updateFx(){
  if(!audio)return;
  const r=Number($('#reverb').value)/100,d=Number($('#delayAmt').value)/100;
  reverbSend.gain.setTargetAtTime(r*.55,audio.currentTime,.03);
  delaySend.gain.setTargetAtTime(d*.40,audio.currentTime,.03);
  delayFeedback.gain.setTargetAtTime(.10+d*.35,audio.currentTime,.03);
}

function scaleConfig(){
  return {
    root:Number($('#root').value),
    scale:SCALES[$('#scale').value],
    range:$('#range').value
  }
}
function noteFromNormY(ny){
  const cfg=scaleConfig(), degrees=cfg.scale, octaves=cfg.range==='wide'?3:2;
  const pos=clamp(1-ny,0,.9999);
  const step=Math.floor(pos*(degrees.length*octaves));
  const semi=cfg.root+degrees[step%degrees.length]+12*Math.floor(step/degrees.length);
  const midi=BASE_MIDI[cfg.range]+semi;
  return {step,midi,freq:440*Math.pow(2,(midi-69)/12)};
}

function freqForScaleStep(step){
  const cfg=scaleConfig(), degrees=cfg.scale, octaves=cfg.range==='wide'?3:2;
  const max=degrees.length*octaves;
  step=clamp(step,0,max-1);
  const semi=cfg.root+degrees[step%degrees.length]+12*Math.floor(step/degrees.length);
  const midi=BASE_MIDI[cfg.range]+semi;
  return 440*Math.pow(2,(midi-69)/12);
}

function stickyScaleNote(ny,lastStep=null){
  /*
    連奏而不是一路滑音：
    音高只落在選定音階裡，但跨音時不重新斷氣。
    hysteresis 讓手指在音階邊界附近的小抖動不會一直換音。
  */
  const cfg=scaleConfig(), degrees=cfg.scale, octaves=cfg.range==='wide'?3:2;
  const count=degrees.length*octaves;
  const raw=clamp(1-ny,0,.9999)*count;
  let candidate=clamp(Math.floor(raw),0,count-1);

  if(lastStep!==null && Number.isFinite(lastStep)){
    const margin=.18;
    if(candidate>lastStep && raw < lastStep+1+margin) candidate=lastStep;
    if(candidate<lastStep && raw > lastStep-margin) candidate=lastStep;
  }
  return {step:candidate,freq:freqForScaleStep(candidate)};
}

function harmonyFreqsForStep(step,mode){
  if(mode==='soft')return [freqForScaleStep(step),freqForScaleStep(step+2)];
  if(mode==='rich')return [freqForScaleStep(step),freqForScaleStep(step+2),freqForScaleStep(step+4)];
  return [freqForScaleStep(step)];
}

function harmonyFreqs(ny,mode){
  const base=noteFromNormY(ny),cfg=scaleConfig(),degrees=cfg.scale,octaves=cfg.range==='wide'?3:2;
  const max=degrees.length*octaves;
  const stepToFreq=(st)=>{
    st=clamp(st,0,max-1);
    const semi=cfg.root+degrees[st%degrees.length]+12*Math.floor(st/degrees.length);
    const midi=BASE_MIDI[cfg.range]+semi;
    return 440*Math.pow(2,(midi-69)/12);
  };
  if(mode==='soft')return [base.freq,stepToFreq(base.step+2)];
  if(mode==='rich')return [base.freq,stepToFreq(base.step+2),stepToFreq(base.step+4)];
  return [base.freq];
}

function envelope(g,now,peak,a,h,r){
  g.gain.cancelScheduledValues(now);g.gain.setValueAtTime(.0001,now);
  g.gain.exponentialRampToValueAtTime(Math.max(.005,peak),now+a);
  g.gain.setValueAtTime(Math.max(.004,peak*.78),now+a+h);
  g.gain.exponentialRampToValueAtTime(.0001,now+a+h+r);
}

function oneShot(type,f,v=.12){
  initAudio();const now=audio.currentTime;
  const g=audio.createGain(),filt=audio.createBiquadFilter();filt.type='lowpass';filt.frequency.value=3000;g.connect(filt).connect(master);

  if(type==='bell'){
    envelope(g,now,v,.005,.02,1.15);
    [[1,1],[2.01,.22],[3.99,.07]].forEach(([m,a])=>{const o=audio.createOscillator(),gg=audio.createGain();o.type='sine';o.frequency.value=f*m;gg.gain.value=a;o.connect(gg).connect(g);o.start(now);o.stop(now+1.25)})
  }else if(type==='wood'){
    filt.frequency.value=1900; envelope(g,now,v*.9,.003,.008,.34);
    const o=audio.createOscillator();o.type='sine';o.frequency.value=f;o.connect(g);o.start(now);o.stop(now+.38);
    const n=audio.createBufferSource(),ng=audio.createGain();n.buffer=noiseBuffer;ng.gain.setValueAtTime(.025,now);ng.gain.exponentialRampToValueAtTime(.0001,now+.035);n.connect(ng).connect(g);n.start(now);n.stop(now+.04)
  }else if(type==='pluck'||type==='guqin'){

const playbackVoices=new Map();
const playbackPitchState=new Map();

const strokePlaybackCache=new Map();

/*
  將每一筆畫轉成「播放軌跡」：
  不靠節奏格，也不要求掃描線剛好撞到原始取樣點。
  只要掃描線位於這一筆的左右範圍內，就會從鄰近筆跡估算連續 y，
  因此手指畫得快、取樣點較疏，也不容易出現聲音斷洞。
*/
function buildStrokePlaybackTrack(stroke){
  if(strokePlaybackCache.has(stroke.id))return strokePlaybackCache.get(stroke.id);
  const pts=stroke.points||[];
  if(pts.length<2){
    const empty={minX:2,maxX:-1,samples:[]};
    strokePlaybackCache.set(stroke.id,empty);return empty;
  }

  let minX=1,maxX=0;
  for(const p of pts){minX=Math.min(minX,p.x);maxX=Math.max(maxX,p.x)}
  const span=Math.max(.0001,maxX-minX);

  // 約 240 個水平樣本；窄筆畫仍至少有足夠解析度。
  const N=Math.max(48,Math.min(360,Math.ceil(span*360)));
  const samples=new Array(N);
  let lastY=pts[0].y,lastV=pts[0].v||.11;

  for(let i=0;i<N;i++){
    const nx=minX + span*(i/(N-1));
    let best=null,bestScore=Infinity;

    // 尋找與 nx 最近的線段，優先真正跨過 nx 的線段。
    for(let j=1;j<pts.length;j++){
      const a=pts[j-1],b=pts[j];
      const lo=Math.min(a.x,b.x),hi=Math.max(a.x,b.x);
      const dx=b.x-a.x;
      let t,distX;

      if(nx>=lo && nx<=hi && Math.abs(dx)>.000001){
        t=(nx-a.x)/dx;
        distX=0;
      }else{
        // 沒有正好跨到時，用距離 nx 最近的端點做小範圍補洞。
        const da=Math.abs(nx-a.x),db=Math.abs(nx-b.x);
        if(da<db){t=0;distX=da}else{t=1;distX=db}
      }

      const y=a.y+(b.y-a.y)*t;
      const v=(a.v||.11)+((b.v||.11)-(a.v||.11))*t;

      // y 連續性也納入分數，避免回頭筆畫突然跳去另一個交叉點。
      const score=distX*8 + Math.abs(y-lastY)*.10;
      if(score<bestScore){bestScore=score;best={y,v,distX}}
    }

    // 最多容許約畫布寬 1.8% 的水平空隙，超過才視為真正中斷。
    if(best && best.distX<=.018){
      lastY=best.y;lastV=best.v;
      samples[i]={y:lastY,v:lastV};
    }else{
      samples[i]=null;
    }
  }

  // 對很短的小洞做線性補間，避免取樣不均造成「破音」。
  const maxGap=8;
  let i=0;
  while(i<N){
    if(samples[i]){i++;continue}
    const start=i-1;
    let j=i;while(j<N && !samples[j])j++;
    const gap=j-i;
    if(start>=0 && j<N && gap<=maxGap){
      const a=samples[start],b=samples[j];
      for(let k=1;k<=gap;k++){
        const u=k/(gap+1);
        samples[start+k]={y:a.y+(b.y-a.y)*u,v:a.v+(b.v-a.v)*u};
      }
    }
    i=j;
  }

  const track={minX,maxX,samples};
  strokePlaybackCache.set(stroke.id,track);
  return track;
}

function sampleStrokeTrack(stroke,nx){
  const tr=buildStrokePlaybackTrack(stroke);
  if(nx<tr.minX || nx>tr.maxX || !tr.samples.length)return null;
  const u=(nx-tr.minX)/Math.max(.000001,tr.maxX-tr.minX);
  const pos=u*(tr.samples.length-1);
  const i=Math.floor(pos),j=Math.min(tr.samples.length-1,i+1),f=pos-i;
  const a=tr.samples[i],b=tr.samples[j];
  if(!a && !b)return null;
  if(!a)return b;if(!b)return a;
  return {y:a.y+(b.y-a.y)*f,v:a.v+(b.v-a.v)*f};
}


function sampleStrokeAtX(stroke,nx){
  const pts=stroke.points;
  if(!pts || pts.length<2)return null;

  // Find every segment crossed by the vertical playhead, then use the most
  // recently drawn crossing. This also behaves well when a stroke bends back.
  let hit=null,best=-1;
  for(let i=1;i<pts.length;i++){
    const a=pts[i-1],b=pts[i];
    const minX=Math.min(a.x,b.x),maxX=Math.max(a.x,b.x);
    if(nx < minX-.0015 || nx > maxX+.0015)continue;

    const dx=b.x-a.x;
    let t;
    if(Math.abs(dx)<.00001){
      if(Math.abs(nx-a.x)>.004)continue;
      t=.5;
    }else{
      t=clamp((nx-a.x)/dx,0,1);
    }

    const ny=a.y+(b.y-a.y)*t;
    const v=(a.v||.10)+((b.v||.10)-(a.v||.10))*t;
    if(i>best){hit={ny,v};best=i}
  }
  return hit;
}

function activeSustainedAtX(nx){
  const sustained=new Set(['flute','pad']);
  const found=[];
  for(const s of strokes){
    if(!sustained.has(s.type))continue;
    const p=sampleStrokeTrack(s,nx);
    if(p)found.push({stroke:s,ny:p.y,v:p.v});
  }
  // 同時最多四條長音聲部，避免混濁；優先保留力度較明顯的筆畫。
  found.sort((a,b)=>(b.v||0)-(a.v||0));
  return found.slice(0,2);
}


function startPlaybackVoice(key,type,f,v){
  initAudio();const now=audio.currentTime;
  const g=audio.createGain(),filt=audio.createBiquadFilter();
  filt.type='lowpass';
  filt.frequency.value=type==='flute'?3600:type==='pad'?1800:type==='guqin'?1450:1900;

  const o1=audio.createOscillator(),o2=audio.createOscillator(),g2=audio.createGain();
  o1.type=type==='flute'?'sine':'triangle';
  o2.type='sine';
  o1.frequency.setValueAtTime(f,now);
  o2.frequency.setValueAtTime(f*(type==='pad'?1.006:2.002),now);
  g2.gain.value=type==='pad'?.14:type==='flute'?.03:.07;

  o1.connect(g);o2.connect(g2).connect(g);g.connect(filt).connect(master);
  g.gain.setValueAtTime(.0001,now);
  g.gain.exponentialRampToValueAtTime(Math.max(.005,v*.56),now+.045);
  o1.start(now);o2.start(now);

  let vib=null,vibGain=null;
  if(type==='flute'){
    vib=audio.createOscillator();vibGain=audio.createGain();
    vib.frequency.value=5.0;vibGain.gain.value=f*.004;
    vib.connect(vibGain).connect(o1.frequency);vib.start(now);
  }

}

function movePlaybackVoice(key,f,v){
  const z=playbackVoices.get(key);if(!z)return false;const now=audio.currentTime;
  z.o1.frequency.setTargetAtTime(f,now,.028);
  z.o2.frequency.setTargetAtTime(f*(z.type==='pad'?1.006:2.002),now,.035);
  z.g.gain.setTargetAtTime(Math.max(.004,v*.56),now,.06);
  return true;
}

function stopPlaybackVoice(key,fast=false){
  const z=playbackVoices.get(key);if(!z)return;const now=audio.currentTime;
  z.g.gain.cancelScheduledValues(now);

  try{z.o1.stop(now+(fast?.15:.32));z.o2.stop(now+(fast?.15:.32));if(z.vib)z.vib.stop(now+(fast?.15:.32))}catch(e){}
  playbackVoices.delete(key);
}

function strokeSegment(a,b,type,w,alpha){
  ic.save();ic.globalCompositeOperation='multiply';ic.lineCap='round';ic.lineJoin='round';ic.strokeStyle=COLORS[type];
  ic.globalAlpha=alpha*.11;ic.lineWidth=w*2.7;ic.shadowColor=COLORS[type];ic.shadowBlur=4;
  ic.beginPath();ic.moveTo(a.x,a.y);ic.quadraticCurveTo(a.x,a.y,(a.x+b.x)/2,(a.y+b.y)/2);ic.stroke();
  ic.shadowBlur=0;ic.globalAlpha=alpha*.72;ic.lineWidth=w;
  ic.beginPath();ic.moveTo(a.x,a.y);ic.quadraticCurveTo(a.x,a.y,(a.x+b.x)/2,(a.y+b.y)/2);ic.stroke();
  if(Math.random()<.35){
    ic.globalAlpha=alpha*.10;ic.lineWidth=Math.max(.7,w*.20);
    const off=(Math.random()-.5)*w*.8;ic.beginPath();ic.moveTo(a.x,a.y+off);ic.lineTo(b.x,b.y+off*.55);ic.stroke();
  }
  ic.restore();
}

  }
}

function pressureValue(e,speed=0){
  if(e.pointerType==='pen'&&e.pressure>0)return clamp(e.pressure,.08,1);
  return clamp(.48-speed*.22,.28,.62);
}

ink.addEventListener('pointerdown',e=>{
  if(playing)return;e.preventDefault();initAudio();ink.setPointerCapture(e.pointerId);
  if(sessionStart===null)sessionStart=performance.now();
  const p=pressureValue(e),t=performance.now()-sessionStart;
  const point={x:e.clientX,y:e.clientY,t,w:3.5+p*10,a:.30+p*.50,v:.055+p*.18};
  const s={id:String(Date.now())+Math.random(),type:instrument,points:[{...point,x:point.x/W,y:point.y/H}]};
  strokes.push(s);strokePlaybackCache.clear();active.set(e.pointerId,{s,last:point,lastSound:0});
  const liveNote=stickyScaleNote(point.y/H,null);
  active.get(e.pointerId).lastStep=liveNote.step;
  if(!startLiveVoice(e.pointerId,instrument,liveNote.freq,point.v))oneShot(instrument,liveNote.freq,point.v);
  enableActions();$('#status').textContent='一筆會盡量保持連續；上下移動會平滑改變音高';
});
ink.addEventListener('pointermove',e=>{
  const z=active.get(e.pointerId);if(!z||playing)return;e.preventDefault();
  const nowT=performance.now()-sessionStart,b={x:e.clientX,y:e.clientY,t:nowT},a=z.last;
  const dt=Math.max(1,b.t-a.t),dist=Math.hypot(b.x-a.x,b.y-a.y);if(dist<2.3)return;
  const speed=clamp(dist/dt,0,2),p=pressureValue(e,speed);
  b.w=clamp(3+p*10-speed*2.0,2.2,14);b.a=.28+p*.50;b.v=.05+p*.18;
  strokeSegment(a,b,z.s.type,b.w,b.a);z.s.points.push({x:b.x/W,y:b.y/H,t:b.t,w:b.w,a:b.a,v:b.v});z.last=b;
  const q=stickyScaleNote(b.y/H,z.lastStep);
  z.lastStep=q.step;
  if(!moveLiveVoice(e.pointerId,q.freq,b.v)){
    const gap=(z.s.type==='guqin'||z.s.type==='pluck')?190:135;
    if(b.t-z.lastSound>gap){oneShot(z.s.type,q.freq,b.v*.70);z.lastSound=b.t}
  }
});

function meterInfo(){
  const [num,den]=$('#meter').value.split('/').map(Number);
  const bars=Number($('#bars').value),stepsPerQuarter=Number($('#quantize').value);
  const quarterPerBeat=4/den,totalQuarters=bars*num*quarterPerBeat;
  const slots=Math.max(4,Math.round(totalQuarters*stepsPerQuarter));
  const slotMs=(60000/Number($('#bpm').value))/stepsPerQuarter;
  return {num,den,bars,stepsPerQuarter,totalQuarters,slots,slotMs};
}
function buildScore(){
  const m=meterInfo(),bins=Array.from({length:m.slots},()=>[]);
  for(const s of strokes)for(const p of s.points){
    const k=Math.min(m.slots-1,Math.floor(p.x*m.slots));
    bins[k].push({type:s.type,ny:p.y,v:p.v||.11});
  }
  return bins.map(bin=>{
    const chosen=[],seen=new Set();
    bin.sort((a,b)=>b.v-a.v);
    for(const n of bin){
      const q=noteFromNormY(n.ny),key=n.type+':'+q.step;
      if(!seen.has(key)){chosen.push(n);seen.add(key)}
      if(chosen.length>=3)break;
    }
    return chosen;
  });
}

    g.gain.setValueAtTime(v,now);g.gain.exponentialRampToValueAtTime(.0001,now+.22);o.connect(g).connect(master);o.start();o.stop(now+.23);
  }else{

    f.frequency.value=kind==='hat'?5600:1300;g.gain.setValueAtTime(v,now);g.gain.exponentialRampToValueAtTime(.0001,now+(kind==='hat'?.045:.12));
    n.connect(f).connect(g).connect(master);n.start();n.stop(now+.14);

}
function playGroove(slot,m,hasNotes){
  const mode=$('#groove').value;if(mode==='off')return;
  const density=Number($('#density').value)/100,spq=m.stepsPerQuarter;
  const quarterIndex=slot/spq,nearQuarter=Math.abs(quarterIndex-Math.round(quarterIndex))<.001;
  const eighthIndex=slot/(spq/2||1),nearEighth=spq>=2&&Math.abs(eighthIndex-Math.round(eighthIndex))<.001;
  const beat=Math.floor(quarterIndex)%Math.max(1,m.num);
  if(nearQuarter){
    if(beat===0)drum('kick',.10);
    else if(mode!=='air'&&beat%2===1)drum('snare',.048);
    else if(mode==='full'&&density>.45)drum('kick',.055);
  }
  if(mode==='full'&&nearEighth&&density>.25)drum('hat',.018+.02*density);
  if(mode==='pulse'&&nearEighth&&hasNotes&&density>.55)drum('hat',.018);
  if(mode==='air'&&nearQuarter&&beat!==0&&density>.65&&Math.random()<.18)drum('hat',.02);
}

async function spatialPlay(){
  if(!strokes.length||playing)return;
  initAudio();playing=true;stopAllPlaybackVoices();
  $('#play').textContent='■ 播放中';
  $('#status').textContent='由左到右讀取・長線會連奏，換音只在音階之間柔順銜接';

  const score=buildScore(),m=meterInfo(),swing=Number($('#swing').value)/100;
  const sustainedTypes=new Set(['flute','pad']);

  // The whole piece length still follows BPM / bars, but sustained lines are
  // sampled around 30 times per second instead of only once per rhythmic grid.
  const totalMs=score.length*m.slotMs;
  const frameMs=1000/60;
  const frames=Math.max(2,Math.ceil(totalMs/frameMs));
  let lastRhythmSlot=-1;

  for(let frame=0;frame<frames;frame++){
    const nx=frame/(frames-1);
    const x=nx*W;

    fc.clearRect(0,0,W,H);
    fc.fillStyle='rgba(255,255,255,.09)';fc.fillRect(0,0,x,H);
    fc.strokeStyle='rgba(58,50,42,.42)';fc.lineWidth=1.2;
    fc.beginPath();fc.moveTo(x,0);fc.lineTo(x,H);fc.stroke();

    // Continuous melodic layer: interpolate directly along each painted stroke.
    const sustained=activeSustainedAtX(nx);
    const presentKeys=new Set();
    for(const n of sustained){
      const prev=playbackPitchState.get(n.stroke.id);
      const q=stickyScaleNote(n.ny,prev?.step ?? null);
      playbackPitchState.set(n.stroke.id,{step:q.step});
      const hs=harmonyFreqsForStep(q.step,$('#harmony').value);

      hs.forEach((f,hIdx)=>{
        const key=n.stroke.id+':'+hIdx;
        presentKeys.add(key);
        const vol=Math.min(.135,(n.v||.11)*.72)*(hIdx===0?1:hIdx===1?.24:.14);
        if(!movePlaybackVoice(key,f,vol))startPlaybackVoice(key,n.stroke.type,f,vol);
      });
    }

    // Give tiny visual/input gaps a short grace period instead of chopping sound.
    for(const key of [...playbackVoices.keys()]){
      if(!presentKeys.has(key)){
        const z=playbackVoices.get(key);
        z.missing=(z.missing||0)+1;
        if(z.missing>11)stopPlaybackVoice(key,false); // 約 180ms 緩衝，避免微小斷點切音
      }else{
        const z=playbackVoices.get(key);if(z)z.missing=0;
      }
    }

    // Rhythmic / percussive layer remains quantized so bells, xylophone and drums
    // still have a clear beat underneath the smooth melodic lines.
    const rhythmSlot=Math.min(score.length-1,Math.floor(nx*score.length));
    if(rhythmSlot!==lastRhythmSlot){
      lastRhythmSlot=rhythmSlot;
      const notes=score[rhythmSlot];
      for(const n of notes){
        if(!sustainedTypes.has(n.type)){
          playMusicalNote(n.type,n.ny,Math.min(.14,(n.v||.11)*.74));
        }
      }
      playGroove(rhythmSlot,m,notes.length>0);
    }

    await sleep(frameMs);
  }

  stopAllPlaybackVoices();
  fc.clearRect(0,0,W,H);
  $('#play').textContent='▶ 播放';playing=false;
  $('#status').textContent='播放完成・旋律保持連奏，但不再一路滑過音階外的音';
}

async function historyPlay(){
  if(!strokes.length||playing)return;initAudio();playing=true;$('#history').textContent='■ 歷程中';$('#status').textContent='重現你的作畫順序…';
  ic.clearRect(0,0,W,H);
  const ev=[];for(const s of strokes)for(let i=1;i<s.points.length;i++)ev.push({s,a:s.points[i-1],b:s.points[i]});
  ev.sort((a,b)=>a.b.t-b.b.t);let prev=ev.length?ev[0].b.t:0,lastSound=-999;
  for(const e of ev){
    await sleep(Math.min(55,Math.max(0,e.b.t-prev)));prev=e.b.t;
    const a={x:e.a.x*W,y:e.a.y*H},b={x:e.b.x*W,y:e.b.y*H};strokeSegment(a,b,e.s.type,e.b.w,e.b.a);
    if(e.b.t-lastSound>150){oneShot(e.s.type,noteFromNormY(e.b.y).freq,Math.min(.12,e.b.v*.7));lastSound=e.b.t}
  }
  $('#history').textContent='↺ 歷程';playing=false;$('#status').textContent='歷程播放完成';
}

async function recordDownload(){
  if(!strokes.length||playing)return;initAudio();
  if(!ink.captureStream||typeof MediaRecorder==='undefined'){$('#status').textContent='這個瀏覽器目前不支援直接錄影下載';return}
  const out=document.createElement('canvas');out.width=W*DPR;out.height=H*DPR;
  const oc=out.getContext('2d');oc.setTransform(DPR,0,0,DPR,0,0);
  let running=true;
  const paint=()=>{if(!running)return;oc.clearRect(0,0,W,H);oc.drawImage(paper,0,0,W,H);oc.drawImage(ink,0,0,W,H);oc.drawImage(fx,0,0,W,H);requestAnimationFrame(paint)};paint();

  const vstream=out.captureStream(30),mix=new MediaStream([...vstream.getVideoTracks(),...mediaDest.stream.getAudioTracks()]);
  const candidates=['video/mp4;codecs=h264,aac','video/mp4','video/webm;codecs=vp9,opus','video/webm'];
  const mime=candidates.find(t=>MediaRecorder.isTypeSupported(t))||'';
  let rec;try{rec=new MediaRecorder(mix,mime?{mimeType:mime}:undefined)}catch(err){running=false;$('#status').textContent='目前瀏覽器無法建立錄影檔';return}
  const chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  rec.onstop=()=>{
    running=false;const type=rec.mimeType||mime||'video/webm',ext=type.includes('mp4')?'mp4':'webm';
    const blob=new Blob(chunks,{type}),url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download='音畫布_'+new Date().toISOString().slice(0,10)+'.'+ext;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),5000);$('#status').textContent='作品錄影已產生';
  };
  rec.start();await spatialPlay();await sleep(350);rec.stop();
}

$('#play').addEventListener('click',spatialPlay);
$('#history').addEventListener('click',historyPlay);
$('#record').addEventListener('click',recordDownload);

resize();
applyPreset('gentle');
</script>
